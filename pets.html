<body class="pets-page">

    <!-- Header fixe injecté par header.js -->

    <!-- SIDEBAR : liste des familiers -->
    <aside class="sidebar pet-sidebar">
        <div class="pet-sb-title" data-i18n="collection">Collection</div>
        <div id="petList" class="pet-list"></div>
    </aside>

    <!-- BLOC PRINCIPAL : descente du sentier (scroll-jacking vertical) -->
    <main class="pet-main" id="petMain" tabindex="0" aria-label="Promenade des familiers">

        <!-- Décor (défile en Y). Éléments [data-rate] pilotés par le JS. -->
        <div class="scene" id="scene">
            <div class="field-left"  data-rate="field"></div>
            <div class="field-right" data-rate="field"></div>
            <div class="light"></div>

            <div class="path">
                <div class="path-grain" data-rate="trail"></div>
            </div>
            <div class="grass-l"   data-rate="trail"></div>
            <div class="grass-r"   data-rate="trail"></div>
            <div class="dashed"    data-rate="trail"></div>
            <div class="footsteps" data-rate="trail"></div>

            <!-- Familiers injectés ici (placés "au km" verticalement) -->
            <div class="animals" id="animals"></div>

            <div class="scene-fade"></div>
        </div>

        <!-- Colonne mobile : image + carte (neutre sur desktop, cf. .pet-flow) -->
        <div class="pet-flow" id="petFlow">
        <img class="pet-flow-img" id="petFlowImg" alt="" loading="lazy">

        <!-- Panneau info (carte blanche translucide) -->
        <aside class="pet-info on-right" id="petInfo">
            <div class="card">
                <span class="pet-badge" id="petBadge"><span id="petBadgeLabel"></span></span>
                <h1 class="pet-name" id="petName"></h1>

                <div class="pet-levelbox">
                    <div class="pl-top">
                        <span class="pl-label" data-i18n="yourLevel">Your level</span>
                        <span class="pl-tier" id="petTier"></span>
                    </div>
                    <div class="pl-row">
                        <button type="button" class="pl-step" id="lvlMinus" aria-label="−">−</button>
                        <input type="number" id="petLevelInput" class="pl-input" min="1" step="1" inputmode="numeric">
                        <button type="button" class="pl-step" id="lvlPlus" aria-label="+">+</button>
                        <span class="pl-max" id="petLevelMax"></span>
                    </div>
                    <div class="pl-stars" id="petStars"></div>
                    <div class="pl-adv" id="petAdv" hidden></div>
                </div>

                <div class="pet-sec" data-i18n="skill">Skill</div>
                <div class="pet-skill-main" id="petSkillMain">
                    <div class="psk-head">
                        <img class="psk-img" id="petSkillImg" alt="">
                        <div class="psk-name" id="petSkillName"></div>
                    </div>
                    <div class="psk-lock" id="petSkillLock" hidden></div>
                    <div class="psk-desc" id="petSkillDesc"></div>
                    <div class="psk-effects" id="petSkillEffects"></div>
                </div>

                <div class="pet-sec" data-i18n="progression">Progression</div>
                <div class="pet-cost" id="petCost"></div>
            </div>
        </aside>
        </div>

        <!-- HUD -->
        <div class="pet-progress" id="progress"></div>
        <div class="pet-counter"><b id="cIdx">1</b> / <span id="cTot">14</span></div>
        <div class="pet-hint">
            <span data-i18n="hint">Scroll to descend</span>
            <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </div>
    </main>

    <!-- Socle -->
    <!-- Maillage interne sans JavaScript : la nav du drawer, figee en dur, dans son
         etat ferme (position:fixed + translateX(100%) => hors ecran). Placee AVANT
         les scripts : header.js la reutilise au lieu d en creer une seconde, puis
         hdrBuildDrawer() en remplace le contenu par sa version complete. Le rendu
         final est inchange, et .hdr-drawer-raw coupe l ombre portee tant que le JS
         n a pas hydrate. Cf. MAP.md SS9 : le maillage doit exister sans JS. -->
    <div class="hdr-drawer-overlay" id="hdr-drawer-overlay"></div>
    <aside class="hdr-drawer hdr-drawer-raw" id="hdr-drawer" aria-hidden="true"><nav class="drawer-nav"><div class="drawer-cat">KVK Guide</div><a href="research_calc" class="drawer-tool"><span>Research</span></a><a href="truegold_calc" class="drawer-tool"><span>TrueGold</span></a><a href="waracademy" class="drawer-tool"><span>War Academy</span></a><div class="drawer-cat">Event Optimizer</div><a href="beartrap_calc" class="drawer-tool"><span>Bear Trap</span></a><a href="vikings" class="drawer-tool"><span>Vikings</span></a><a href="caserne" class="drawer-tool"><span>Heroes</span></a><a href="masters" class="drawer-tool"><span>Masters</span><span class="hdr-badge">Beta</span></a><a href="pets" class="drawer-tool"><span>Pets</span></a><div class="drawer-cat">Pack / Shop Calculation</div><a href="shop_calc" class="drawer-tool"><span>Shop Value</span><span class="hdr-badge">Beta</span></a><div class="drawer-cat">Database</div><a href="database/buildings/" class="drawer-tool"><span>Buildings</span></a><a href="database/waracademy/" class="drawer-tool"><span>War Academy Research</span></a><a href="database/masters/" class="drawer-tool"><span>Masters DB</span></a><a href="database/pets/" class="drawer-tool"><span>Pets DB</span></a></nav></aside>
