<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Kingshot Toolbox">
  <defs>
    <!-- gradientUnits="userSpaceOnUse" : le dégradé traverse le glyphe une seule fois.
         En unités d'objet (défaut), chaque forme repartait du doré clair, ce qui créait
         une cassure de ton entre le couvercle et le corps. -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="32" y1="14" x2="32" y2="50">
      <stop offset="0" stop-color="#ffd271"/>
      <stop offset="1" stop-color="#f0a830"/>
    </linearGradient>
  </defs>

  <!-- Tuile sombre à fond perdu (0→64, aucun retrait) : Google découpe le favicon en
       cercle sur une pastille claire, et le moindre retrait laisse des éclats blancs
       dans les coins. Pas de liseré doré non plus — à 16 px il ne faisait qu'un halo sale. -->
  <rect width="64" height="64" rx="12" fill="#1b1e25"/>

  <!-- Anse : 1 px affiché à 16 px = 4 unités ici, donc tout détail plus fin disparaît.
       L'arche est large (22) et haute pour que son trou fasse ~3 px de côté à 16 px. -->
  <path d="M21 31 q11 -17 22 0" fill="none" stroke="url(#gold)" stroke-width="4.2" stroke-linecap="round"/>

  <!-- Caisse d'un seul bloc, barrée d'un trait de couvercle de 4 unités (1 px à 16 px).
       Le trait est rentré de 4 unités de chaque côté : la silhouette de la caisse reste
       continue sur les bords au lieu de se lire comme deux barreaux empilés. -->
  <rect x="13" y="30" width="38" height="20" rx="4" fill="url(#gold)"/>
  <rect x="17" y="35.5" width="30" height="4" rx="2" fill="#1b1e25"/>
</svg>
