# Lance les tests des moteurs de calcul. Aucune dépendance à installer : les tests
# n'utilisent que le lanceur intégré de Node, et le dépôt n'a pas de gestionnaire
# de paquets (cf. MAP.md §10).
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

# Lire le dépôt suffit : sans ce bloc, le jeton du job reçoit les droits par
# défaut du dépôt, écriture comprise.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      # Une page modifiée à la main plutôt que dans son gabarit repartirait à la
      # prochaine génération : autant l'apprendre ici.
      - run: python3 tools/build_pages.py --check
