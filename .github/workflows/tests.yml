# Lance les tests des moteurs de calcul. Aucune dépendance à installer : les tests
# n'utilisent que le lanceur intégré de Node, et le dépôt n'a pas de gestionnaire
# de paquets (cf. MAP.md §10).
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      # Une page modifiée à la main plutôt que dans son gabarit repartirait à la
      # prochaine génération : autant l'apprendre ici.
      - run: python3 tools/build_pages.py --check
      # Même garde pour le menu figé de chaque page : il se déduit de site-config.js
      # (cf. MAP.md §11), un outil ajouté au manifeste sans relancer le script le laisse
      # en retard.
      - run: python3 tools/sync_drawer.py --check
